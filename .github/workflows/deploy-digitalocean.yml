# Build images, push them to DigitalOcean Container Registry, and roll out.
#
# Required repository secrets:
#   DIGITALOCEAN_ACCESS_TOKEN   token with registry and app write scope
#   DO_APP_ID                   App Platform app id
#   DO_REGISTRY                 registry name, e.g. "aegis"
#
# Deployment runs only after CI passes on main. A push that fails tests is
# never deployed.
#
# What the signing here does and does not cover, stated plainly because the
# difference is the whole value of it:
#
# Both images are built, pushed, signed by digest and given a CycloneDX SBOM
# attestation, and the job refuses to roll out if any of that fails to verify
# against this workflow's own OIDC identity. That makes the pushed images an
# attested artifact of record for the commit.
#
# It is now also a statement about the running container. After verification
# this job rewrites the LIVE app spec to run each component from the exact
# digest it verified, so what serves traffic is the artifact that was signed
# rather than App Platform's own rebuild of the same commit.
#
# Two consequences worth knowing before editing this file. The rewrite drops
# each component's `github` block, so `deploy_on_push` stops applying and this
# workflow becomes the only path to production -- deliberate, since an
# auto-deploy from a push would put an unsigned build back in front of traffic.
# And `.do/app.yaml` stays a GitHub-source spec on purpose: it is the bootstrap
# used by `doctl apps create` for a fresh deployment, which has no signed image
# to point at yet.
name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm a manual rollout
        required: true

concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and roll out
    runs-on: ubuntu-latest
    # A manual run needs the typed confirmation; an automatic one needs CI green.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      # Keyless signing. Sigstore issues a short-lived certificate bound to this
      # workflow's OIDC identity, so nothing long-lived has to be stored and
      # rotated, and a signature names the workflow that produced it.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # This job had never run when it was written, so its first real execution
      # is somebody's first deployment. A missing secret otherwise surfaces as
      # `doctl auth` failing to parse an empty token, which names neither the
      # secret nor the person who has to set it.
      - name: Check the deployment credentials are present
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
          DO_REGISTRY: ${{ secrets.DO_REGISTRY }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: |
          missing=()
          [ -n "$DO_TOKEN" ]       || missing+=("secret DIGITALOCEAN_ACCESS_TOKEN (token with registry and app write scope)")
          [ -n "$DO_APP_ID" ]      || missing+=("secret DO_APP_ID (doctl apps list --format ID,Spec.Name)")
          [ -n "$DO_REGISTRY" ]    || missing+=("secret DO_REGISTRY (doctl registry get --format Name)")
          [ -n "$PUBLIC_API_BASE" ]|| missing+=("variable PUBLIC_API_BASE (the app's public https URL, no trailing slash)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::This repository is not configured to deploy yet."
            printf '%s\n' "Set the following under Settings -> Secrets and variables -> Actions:" >&2
            for item in "${missing[@]}"; do printf '  - %s\n' "$item" >&2; done
            exit 1
          fi
          echo "All four are set."

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to the container registry
        run: doctl registry login --expiry-seconds 1200

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set image tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registry=registry.digitalocean.com/${{ secrets.DO_REGISTRY }}" >> "$GITHUB_OUTPUT"

      - name: Build and push both images
        id: images
        run: |
          set -euo pipefail
          REG='${{ steps.tags.outputs.registry }}'
          SHA='${{ steps.tags.outputs.sha }}'

          # The API builds from the repository root: the evaluation packs live
          # at <repo>/packs and the image has to carry them.
          docker build -f apps/api/Dockerfile \
            -t "$REG/aegis-api:$SHA" -t "$REG/aegis-api:latest" .
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE="${{ vars.PUBLIC_API_BASE }}" \
            -t "$REG/aegis-web:$SHA" -t "$REG/aegis-web:latest" apps/web

          for name in aegis-api aegis-web; do
            docker push "$REG/$name:$SHA"
            docker push "$REG/$name:latest"
          done

          # Everything downstream refers to the digest, never the tag. A tag is
          # a mutable pointer, so a signature over a tag says nothing about what
          # that tag resolves to afterwards.
          for name in api web; do
            digest=$(docker image inspect "$REG/aegis-$name:$SHA" \
              --format '{{index .RepoDigests 0}}' | sed 's/.*@//')
            echo "$name=$REG/aegis-$name@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Generate an SBOM for each image
        run: |
          set -euo pipefail
          mkdir -p sbom
          syft scan "${{ steps.images.outputs.api }}" -o cyclonedx-json=sbom/api.cdx.json
          syft scan "${{ steps.images.outputs.web }}" -o cyclonedx-json=sbom/web.cdx.json
          # An empty bill of materials must not pass for one.
          python3 scripts/check_sbom.py sbom/api.cdx.json sbom/web.cdx.json

      - name: Sign both images and attest their SBOMs
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for pair in "api:${{ steps.images.outputs.api }}" "web:${{ steps.images.outputs.web }}"; do
            name="${pair%%:*}"; ref="${pair#*:}"
            cosign sign "$ref"
            cosign attest --type cyclonedx --predicate "sbom/$name.cdx.json" "$ref"
          done

      # Signing and then deploying without checking is a ritual, not a control.
      # This re-reads what the registry now holds and fails the job -- before
      # any rollout -- if the signature or the attestation does not verify
      # against this workflow's own identity.
      #
      # The identity is pinned deliberately. `cosign verify` with no identity
      # constraint accepts a valid signature from anybody, which is the usual
      # way this check ends up proving nothing.
      - name: Verify the signatures and attestations before rolling out
        run: |
          set -euo pipefail
          IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy-digitalocean.yml@${GITHUB_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          echo "Requiring signer identity: $IDENTITY"
          for ref in "${{ steps.images.outputs.api }}" "${{ steps.images.outputs.web }}"; do
            cosign verify \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            cosign verify-attestation --type cyclonedx \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$ref" > /dev/null
            echo "verified: $ref"
          done

      - name: Publish the bills of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom-images-${{ steps.tags.outputs.sha }}
          path: sbom/
          if-no-files-found: error

      # Only reached once both images verified above. This is what closes the
      # gap between "signed" and "serving": until now App Platform rebuilt from
      # GitHub source and ran its own output, so the signature described an
      # artifact of record rather than the artifact handling traffic.
      #
      # It patches the LIVE spec rather than applying .do/app.yaml. That file
      # holds placeholders like ${SPACES_KEY} for its seven secrets, and
      # applying it would overwrite the real encrypted values -- object store,
      # signing key and bootstrap password at once. `doctl apps spec get`
      # returns secrets as encrypted EV[1:...] blobs that round-trip safely.
      - name: Point the running app at the images that were just verified
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          doctl apps spec get "${{ secrets.DO_APP_ID }}" --format yaml > /tmp/live-spec.yaml
          python3 scripts/pin_app_images.py /tmp/live-spec.yaml \
            --api "${{ steps.images.outputs.api }}" \
            --web "${{ steps.images.outputs.web }}" \
            --out /tmp/pinned-spec.yaml
          echo "::group::What this rollout changes in the spec"
          diff -u /tmp/live-spec.yaml /tmp/pinned-spec.yaml || true
          echo "::endgroup::"

      - name: Roll out to App Platform
        run: doctl apps update "${{ secrets.DO_APP_ID }}" --spec /tmp/pinned-spec.yaml --wait

      - name: Verify the deployment is serving
        run: |
          BASE='${{ vars.PUBLIC_API_BASE }}'
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/health" > /tmp/health.json; then
              echo "Health check passed:"; cat /tmp/health.json; exit 0
            fi
            echo "Attempt $attempt: not ready yet"; sleep 10
          done
          echo "The deployment did not become healthy."; exit 1

      - name: Verify the evidence store is writable
        # A deployment whose object store is unreachable would run campaigns
        # and fail to keep what they produced. Catch it here, not later.
        run: |
          BASE='${{ vars.PUBLIC_API_BASE }}'
          STATUS=$(curl -fsS "$BASE/health/storage" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "Evidence store: $STATUS"
          test "$STATUS" = "ok"

      - name: Prune old images
        if: success()
        run: doctl registry garbage-collection start --include-untagged-manifests --force || true
