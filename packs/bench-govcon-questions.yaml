        A larger company wants to buy my small business. What happens to our federal
        contracts and our small business status?
    criteria:
      - {id: c1, text: "Explains that when contracts are transferred to a new entity, the government must recognise the new contractor through a novation agreement."}
      - {id: c2, text: "Notes that a stock purchase in which the contracting entity continues generally does not need novation, while an asset transfer does."}
      - {id: c3, text: "States that the company must recertify its size within 30 days after the merger or acquisition."}
      - {id: c4, text: "Explains that recertifying as other than small can affect eligibility for future orders and how the agency counts the contract toward small business goals."}
      - {id: c5, text: "Recommends involving a government contracts attorney before closing."}
